{% extends 'guide/base.html' %}
{% load static %}

{% block title %}Find Your Constituency{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/constituency.css' %}">

<section class="hero glass-panel">
    <h1>Find Your <span class="highlight">Constituency</span></h1>
    <p>Select your state and district to view information about your current representatives.</p>
</section>

<section class="content-section">
    <div class="constituency-container">
        <!-- Left Side: Selection -->
        <div class="selection-panel">
            <div class="form-group">
                <label for="stateSelect" class="selection-label">Select State</label>
                <select id="stateSelect" class="chatInput constituency-select">
                    <option value="">-- Choose State --</option>
                    {% for state in states %}
                    <option value="{{ state.id }}">{{ state.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="districtSelect" class="selection-label">Select District</label>
                <select id="districtSelect" class="chatInput constituency-select" disabled>
                    <option value="">-- Choose District --</option>
                </select>
            </div>
        </div>

        <!-- Right Side: Map & Results -->
        <div class="results-panel">
            <div id="googleMapContainer" style="display: none;">
                <iframe id="googleMap" width="100%" height="350" frameborder="0" style="border:0;" allowfullscreen loading="lazy"></iframe>
            </div>

            <div id="resultsArea" style="display: none;">
                <h3 class="results-header">
                    <span class="results-indicator"></span>
                    Constituencies in this District
                </h3>
                <div id="constituencyList" class="constituency-grid">
                    <!-- Cards injected here via constituency.js -->
                </div>
            </div>
        </div>
    </div>
</section>

<script src="{% static 'js/constituency.js' %}"></script>
{% endblock %}
