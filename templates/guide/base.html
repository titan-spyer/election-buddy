{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Buddy | {% block title %}{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav class="navbar">
        <a href="{% url 'index' %}" class="logo">
            <img src="{% static 'images/logo.png' %}" alt="Election Buddy Logo" class="logoImg">
            <span>Election Buddy</span>
        </a>
        <div class="navLinks">
            <a href="{% url 'index' %}">Home</a>
            <a href="{% url 'process' %}">Process</a>
            <a href="{% url 'timeline' %}">Timeline</a>
            <a href="{% url 'steps' %}">Steps</a>
            <a href="{% url 'constituency_lookup' %}">Find Constituency</a>
        </div>
    </nav>

    <div class="mainContent">
        {% block content %}{% endblock %}
    </div>

    <!-- Help Popup System -->
    <div class="helpBtn" id="helpBtn" onclick="toggleHelp()">?</div>
    
    <div class="helpPopup" id="helpPopup">
        <div class="helpHeader">
            <h3>AI Guide Assistant</h3>
            <span class="closeBtn" onclick="toggleHelp()">✖</span>
        </div>
        <div class="aiChatBox" id="aiChatBox">
            <div class="chatMsg msgAi">Hi! I'm here to help you understand the election process. Ask me anything!</div>
        </div>
        <div class="chatInputArea">
            <input type="text" id="userInput" class="chatInput" placeholder="Type your question..." onkeypress="handleKeyPress(event)">
            <button class="chatSendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const geminiApiKey = "{{ geminiApiKey|escapejs }}";

        function toggleHelp() {
            const popup = document.getElementById('helpPopup');
            popup.classList.toggle('active');
        }

        function handleKeyPress(e) {
            if(e.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const message = inputField.value.trim();
            if(!message) return;

            addMessage(message, 'msgUser');
            inputField.value = '';

            // Add loading message
            const loadingId = addMessage("Thinking...", 'msgAi');

            try {
                // Call Gemini API (placeholder logic, expects real endpoint and key)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: "You are a helpful assistant explaining the election process to someone who may have lower education or no technical background. Keep answers short, simple, and encouraging. User says: " + message
                            }]
                        }]
                    })
                });

                const data = await response.json();
                
                // Remove loading message
                const chatBox = document.getElementById('aiChatBox');
                const loadMsg = document.getElementById(loadingId);
                if(loadMsg) chatBox.removeChild(loadMsg);

                let aiReply = "I'm sorry, I couldn't understand that.";
                if(data && data.candidates && data.candidates[0].content.parts[0].text) {
                    aiReply = data.candidates[0].content.parts[0].text;
                }
                
                addMessage(aiReply, 'msgAi');

            } catch (err) {
                console.error(err);
                const chatBox = document.getElementById('aiChatBox');
                const loadMsg = document.getElementById(loadingId);
                if(loadMsg) chatBox.removeChild(loadMsg);
                addMessage("Oops! Connection failed. Please make sure the API key is set.", 'msgAi');
            }
        }

        function addMessage(text, className) {
            const chatBox = document.getElementById('aiChatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `chatMsg ${className}`;
            msgDiv.innerText = text;
            
            const msgId = 'msg-' + Date.now();
            msgDiv.id = msgId;
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            return msgId;
        }
    </script>
</body>
</html>
