{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Buddy | {% block title %}{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>

    <nav class="navbar">
        <a href="{% url 'index' %}" class="logo">
            <img src="{% static 'images/logo.png' %}" alt="Election Buddy Logo" class="logoImg">
            <span>Election Buddy</span>
        </a>
        
        <div class="navLinks" id="navLinks">
            <a href="{% url 'index' %}">Home</a>
            <a href="{% url 'process' %}">Process</a>
            <a href="{% url 'timeline' %}">Timeline</a>
            <a href="{% url 'steps' %}">Steps</a>
            <a href="{% url 'constituency_lookup' %}">Find Constituency</a>
            <button onclick="triggerTranslate()" class="translateBtn" id="translateBtn">🌐 Translate Page</button>
        </div>

        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        
        <!-- Hidden Google Translate Element -->
        <div id="google_translate_element" style="display:none;"></div>
    </nav>

    <div class="mainContent">
        {% block content %}{% endblock %}
    </div>

    <!-- Help Popup System -->
    <div class="helpBtn" id="helpBtn" onclick="toggleHelp()">?</div>
    
    <div class="helpPopup" id="helpPopup">
        <div class="helpHeader">
            <h3>AI Guide Assistant</h3>
            <span class="closeBtn" onclick="toggleHelp()">✖</span>
        </div>
        <div class="aiChatBox" id="aiChatBox">
            <div class="chatMsg msgAi">Hi! I'm here to help you understand the election process. Ask me anything!</div>
        </div>
        <div class="chatInputArea">
            <input type="text" id="userInput" class="chatInput" placeholder="Type your question..." onkeypress="handleKeyPress(event)">
            <button class="chatSendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="{% static 'js/base.js' %}"></script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
